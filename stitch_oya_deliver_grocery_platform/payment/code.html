<body class="min-h-screen flex flex-col font-body-md text-on-surface">

<div class="font-display-logo text-display-logo text-on-primary dark:text-on-primary-container flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">local_mall</span>

<a class="text-on-primary/70 dark:text-on-primary-container/70 hover:opacity-80 transition-opacity font-label-bold text-label-bold flex flex-col justify-center" href="#">Home</a>
<a class="text-on-primary/70 dark:text-on-primary-container/70 hover:opacity-80 transition-opacity font-label-bold text-label-bold flex flex-col justify-center" href="#">Products</a>
</nav>
<div class="flex gap-md items-center">
<button class="hover:opacity-80 transition-opacity text-on-primary/70 dark:text-on-primary-container/70 flex items-center justify-center p-sm">
<span class="material-symbols-outlined">shopping_cart</span>
</button>
<button class="hover:opacity-80 transition-opacity text-on-primary/70 dark:text-on-primary-container/70 flex items-center justify-center p-sm">
<span class="material-symbols-outlined">account_circle</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-xl px-gutter md:px-lg w-full max-w-container-max mx-auto flex flex-col items-center justify-center">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant shadow-[0_1px_2px_rgba(0,0,0,0.05)] rounded-lg p-lg">
<div class="mb-lg">
<h1 class="font-headline-md text-headline-md text-primary mb-sm">Secure Payment</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Complete your order for Oyadeliver.</p>
</div>
<form class="space-y-md">
<!-- Accepted Cards Visual -->
<div class="flex items-center gap-sm mb-md p-sm bg-surface-container-low rounded border border-outline-variant">
<span class="material-symbols-outlined text-secondary">credit_card</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Accepted Cards</span>
<div class="flex gap-xs ml-auto">
<!-- Simulated card icons using CSS/spans for strict structural adherence -->
<div class="w-8 h-5 bg-surface-tint rounded-sm flex items-center justify-center text-[8px] text-white font-bold tracking-tighter">VISA</div>
<div class="w-8 h-5 bg-primary-container rounded-sm flex items-center justify-center text-[8px] text-white font-bold tracking-tighter">MC</div>
</div>
</div>
<!-- Card Number -->
<div class="flex flex-col gap-[4px]">
<label class="font-label-bold text-label-bold text-on-surface" for="cardNumber">Card Number</label>
<div class="relative flex items-center input-border rounded-input bg-surface-container-lowest input-focus">
<span class="material-symbols-outlined absolute left-sm text-outline">credit_card</span>
<input class="w-full bg-transparent border-none py-sm pl-[36px] pr-sm font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant rounded-input" id="cardNumber" placeholder="0000 0000 0000 0000" type="text"/>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<!-- Expiry -->
<div class="flex flex-col gap-[4px]">
<label class="font-label-bold text-label-bold text-on-surface" for="expiry">Expiry Date</label>
<div class="flex items-center input-border rounded-input bg-surface-container-lowest input-focus">
<input class="w-full bg-transparent border-none py-sm px-sm font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant rounded-input" id="expiry" placeholder="MM/YY" type="text"/>
</div>
</div>
<!-- CVV -->
<div class="flex flex-col gap-[4px]">
<label class="font-label-bold text-label-bold text-on-surface flex items-center gap-xs" for="cvv">
                            CVV
                            <span class="material-symbols-outlined text-[14px] text-outline cursor-help" title="3 digits on back of card">info</span>
</label>
<div class="flex items-center input-border rounded-input bg-surface-container-lowest input-focus">
<input class="w-full bg-transparent border-none py-sm px-sm font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant rounded-input" id="cvv" placeholder="123" type="text"/>
</div>
</div>
</div>
<!-- Name on Card -->
<div class="flex flex-col gap-[4px]">
<label class="font-label-bold text-label-bold text-on-surface" for="cardName">Name on Card</label>
<div class="flex items-center input-border rounded-input bg-surface-container-lowest input-focus">
<input class="w-full bg-transparent border-none py-sm px-sm font-body-md text-body-md text-on-surface focus:ring-0 placeholder:text-outline-variant rounded-input" id="cardName" placeholder="Full Name" type="text"/>
</div>
</div>
<div class="pt-sm flex flex-col gap-sm">

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lock</span>

<button class="w-full bg-[#555f70] text-white font-label-bold text-label-bold py-[10px] rounded-[4px] flex items-center justify-center hover:opacity-90 transition-opacity" type="button">

</div>

<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-sm text-label-sm">Payments are secure and encrypted.</span>
</div>
